---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: admin-web-users-api

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-users-api
        creationPolicy: Owner
    dataFrom:
        # The Akeyless secret at this path must have a key named USERS_API_INTERNAL_SERVICE_TOKEN
        # (dataFrom.extract projects Akeyless key names straight through to the k8s Secret, and
        # that's the env var name UsersAPIConfig.swift reads) whose value is the exact same
        # secret as users-api's own INTERNAL_SERVICE_TOKEN (see that repo's
        # Sources/App/Services/InternalServiceAuth.swift and AGENTS.md) - admin-web presents
        # this instead of an Auth0 bearer token, since it never holds one of its own. users-api's
        # own kubernetes/overlays/dev/secrets.yaml reads this same Akeyless path (rewriting the
        # key name to INTERNAL_SERVICE_TOKEN) - one shared secret value, not two that could
        # drift apart.
        - extract:
              key: /sweetrpg/admin/web/users-api

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: admin-web-auth-api

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-auth-api
        creationPolicy: Owner
    dataFrom:
        # The Akeyless secret at this path must have a key named AUTH_API_INTERNAL_SERVICE_TOKEN
        # (that's the env var name AuthAPIConfig.swift reads) whose value is the exact same
        # secret as auth-api's own INTERNAL_SERVICE_TOKEN (see that repo's
        # Sources/App/Services/InternalServiceAuth.swift) - admin-web presents this instead of
        # an Auth0 bearer token, since it never holds one of its own. A distinct secret from
        # admin-web-users-api above - the two services' internal-service-auth trust boundaries
        # are independent (see sweetrpg/platform's split-authz-into-auth-api change design.md).
        - extract:
              key: /sweetrpg/admin/web/auth-api

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: admin-web-admin-api

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-admin-api
        creationPolicy: Owner
    dataFrom:
        # The Akeyless secret at this path must have a key named ADMIN_API_INTERNAL_SERVICE_TOKEN
        # (dataFrom.extract projects Akeyless key names straight through to the k8s Secret, and
        # that's the env var name AdminAPIConfig.swift reads) whose value is the exact same
        # secret as admin-api's own INTERNAL_SERVICE_TOKEN (see that repo's
        # server/middleware/writeauth.go) - admin-web presents this instead of an Auth0 bearer
        # token on write calls, since it never holds one of its own. admin-api's own
        # kubernetes/overlays/dev/secrets.yaml reads this same Akeyless path (rewriting the key
        # name to INTERNAL_SERVICE_TOKEN) - one shared secret value, not two that could drift
        # apart, same pattern as admin-web-users-api above.
        - extract:
              key: /sweetrpg/admin/web/admin-api

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: admin-web-shared-session

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-shared-session
        creationPolicy: Owner
    dataFrom:
        # auth-web's own Redis instance requires auth - same Akeyless path its own redis-auth
        # ExternalSecret reads (sweetrpg-auth namespace). Read here as plain REDIS_PASS since
        # configure.swift reads the shared session Redis via REDIS_HOST/REDIS_PASS directly
        # (this app has no cache Redis of its own to collide with, unlike catalog-web/main-web's
        # SHARED_SESSION_REDIS_* prefix convention).
        - extract:
              key: /sweetrpg/auth/cache/auth
