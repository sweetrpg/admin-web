---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: admin-web-auth0

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-auth0
        creationPolicy: Owner
    dataFrom:
        # Requires a dedicated Auth0 application for admin-web (its own client id/secret/callback
        # URL) registered in the same tenant catalog-web uses - AUTH0_DOMAIN/AUTH0_CLIENT_ID/
        # AUTH0_CLIENT_SECRET/AUTH0_CALLBACK_URL populated at this Akeyless path once that
        # registration exists. See this repo's README "Known gaps" section - not done yet.
        - extract:
              key: /sweetrpg/dev/admin/auth
