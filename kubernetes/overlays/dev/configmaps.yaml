---
apiVersion: v1
kind: ConfigMap

metadata:
  name: web-env

data:
  ENV: dev
  PORT: "8080"
  # Shared "redis" instance in sweetrpg-support - auth-web's session store this app reads
  # (never writes). Unset means every visitor reads as logged-out, not a startup failure. See
  # docs/frontend-conventions.md's "Shared sweetrpg-support Redis instance" section
  # (sweetrpg/platform) for the full DB-index registry.
  REDIS_HOST: redis.sweetrpg-support.svc.cluster.local
  REDIS_PORT: "6379"
  REDIS_DB: "2"
  # Server-to-server backend URLs, called directly Service-to-Service - no ingress in the path.
  ADMIN_API_URL: http://api-v1.sweetrpg-admin.svc.cluster.local:8000
  USERS_API_URL: http://api-v1.sweetrpg-user.svc.cluster.local:8080
  # Traefik strips /admin before the request reaches this app (see middlewares.yaml), so the
  # app's own routes are unprefixed - but every link/form/redirect it generates needs to add
  # /admin back so the *next* browser request round-trips through the ingress correctly. See
  # Request.basePath in AppPaths.swift.
  INGRESS_BASE_PATH: /admin
  # Where the SweetRPG logo in the nav links out to - the platform's root site, not this app's
  # own home page.
  SWEETRPG_ROOT_URL: https://dev.sweetrpg.com/
  # Base URL for shared frontend static assets (logo, favicon, stylesheet), served from
  # assets-web rather than this app's own Public/.
  SHARED_ASSETS_URL: https://dev.sweetrpg.com/assets
  BUILD_INFO_PATH: /app/config/build-info.json
  LOG_LEVEL: info
