---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: admin-web-users-api

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-users-api
        creationPolicy: Owner
    dataFrom:
        # Same Akeyless path as the dev overlay - see that overlay's comment.
        - extract:
              key: /sweetrpg/admin/web/users-api

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: admin-web-admin-api

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-admin-api
        creationPolicy: Owner
    dataFrom:
        # Same Akeyless path as the dev overlay - see that overlay's comment.
        - extract:
