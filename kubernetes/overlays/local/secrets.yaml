---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: admin-web-shared-session

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-shared-session
        creationPolicy: Owner
    dataFrom:
        # auth-web's own Redis instance requires auth - same Akeyless path its own redis-auth
        # ExternalSecret reads (sweetrpg-auth namespace), matching main-web/catalog-web's
        # SHARED_SESSION_REDIS_PASS convention elsewhere but read here as plain REDIS_PASS,
        # since configure.swift reads the shared session Redis via REDIS_HOST/REDIS_PASS
        # directly rather than a SHARED_SESSION_REDIS_* prefix (this app has no cache Redis of
        # its own to collide with).
        - extract:
              key: /sweetrpg/auth/cache/auth
